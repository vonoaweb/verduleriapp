services:
  - type: web
    name: verduleriapp-api
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      # ─── Stripe (pasarela de pagos) ───
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: mxn
      # ─── Catálogo de Meta/WhatsApp (el ícono 🛍️) ───
      # Mantiene sincronizados precio y disponibilidad con la app.
      - key: META_CATALOG_ID
        value: "1016476710999609"
      # Token con permiso catalog_management. Si no se pone, se intenta con
      # WHATSAPP_ACCESS_TOKEN (puede no tener ese permiso).
      - key: META_CATALOG_TOKEN
        sync: false
      # ─── Seguridad del webhook de WhatsApp ───
      # App secret de Meta (Configuración de la app → Básico). Al ponerlo,
      # el bot rechaza mensajes que no vengan firmados por Meta.
      - key: WHATSAPP_APP_SECRET
        sync: false
